name: Build Ayran Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Ayran source
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Ayran ZIP bulunamadı!"
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Find source root
        shell: bash
        run: |
          set -e
          ROOT=$(find source -name gradlew -type f -print -quit | xargs dirname)
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Kaynak: $ROOT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Ayran Launcher
        working-directory: ${{ env.ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          APK=$(find "$ROOT/app_pojavlauncher/build/outputs" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK bulunamadı!"
            exit 1
          fi

          cp "$APK" output/Ayran-Launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyranLauncher-APK
          path: output/Ayran-Launcher.apk
          if-no-files-found: error
